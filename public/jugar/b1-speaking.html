<style>
/* Juego autocontenido de /juegos (ADR-37): sin React ni backend, se abre con un enlace.
   Celular: app de una pantalla con barra de pestañas abajo. PC (≥900px): pestañas en columna a la izquierda.
   Cada juego conserva el mundo visual de su hoja impresa (tarjetas pastel, chat, ruleta de feria, corcho). */
:root {
  color-scheme: light;
  --bg: #F5F3FA; --surface: #FFFFFF; --surface-2: #EEEAF7; --fg: #1D1B2F; --muted: #6B6880; --line: #E2DEEE;
  --c-cards: #7048E8; --c-chat: #4F46E5; --c-ruleta: #D9481F; --c-corcho: #A8631A; --on-accent: #FFFFFF;
  --accent: var(--c-cards);
  --chat-bg: #F4F1EB; --chat-dot: rgba(79,70,229,.10); --bubble-in: #FFFFFF; --bubble-out: #DBEAFE; --bubble-out-fg: #1E3A8A;
  --wheel-bg: #FFF4DE; --wheel-ink: #1B1F3B;
  --scrim: rgba(20,18,35,.5); --shadow: 0 6px 20px rgba(29,27,47,.10);
  --f-display: 'Poppins', system-ui, sans-serif;
  --f-body: 'Nunito', system-ui, sans-serif;
  --f-game: 'Bungee', Impact, sans-serif;
  --f-hand: 'Patrick Hand', 'Comic Sans MS', cursive;
  --f-script: 'Caveat', 'Segoe Print', cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131220; --surface: #1E1C2E; --surface-2: #2A2740; --fg: #F1EFFA; --muted: #A4A0BC; --line: #322E4A;
  --c-cards: #A58BFF; --c-chat: #8C93FF; --c-ruleta: #FF7A52; --c-corcho: #E3A55A; --on-accent: #15122A;
  --chat-bg: #17151F; --chat-dot: rgba(140,147,255,.10); --bubble-in: #25223A; --bubble-out: #2B3A6B; --bubble-out-fg: #DCE6FF;
  --wheel-bg: #191C36; --wheel-ink: #F1EFFA; --scrim: rgba(0,0,0,.6); --shadow: 0 6px 20px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131220; --surface: #1E1C2E; --surface-2: #2A2740; --fg: #F1EFFA; --muted: #A4A0BC; --line: #322E4A;
  --c-cards: #A58BFF; --c-chat: #8C93FF; --c-ruleta: #FF7A52; --c-corcho: #E3A55A; --on-accent: #15122A;
  --chat-bg: #17151F; --chat-dot: rgba(140,147,255,.10); --bubble-in: #25223A; --bubble-out: #2B3A6B; --bubble-out-fg: #DCE6FF;
  --wheel-bg: #191C36; --wheel-ink: #F1EFFA; --scrim: rgba(0,0,0,.6); --shadow: 0 6px 20px rgba(0,0,0,.4); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; }
button:focus-visible, textarea:focus-visible, .deck:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.no-es .es { display: none !important; }

.app { height: 100%; height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
.top { display: flex; align-items: center; gap: 8px; padding-block: 12px 6px; }
.home { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; text-decoration: none; font: 800 13px var(--f-body); }
.home svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.home span { display: none; }
.home:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ttl { flex: 1; min-width: 0; }
.ttl small { display: block; font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.2; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; height: 36px; padding: 0 12px; font: 800 13px var(--f-body); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; flex: none; font-variant-numeric: tabular-nums; }
.timer .ring { width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(var(--accent) var(--p, 0deg), var(--surface-2) 0); }
.timer.over { background: var(--c-ruleta); color: var(--on-accent); border-color: transparent; animation: shake .4s 2; }
.es-btn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; color: var(--muted); padding-bottom: 10px; font-variant-numeric: tabular-nums; }
.prog .bar { flex: 1; height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 9px; transition: width .4s; }

.stage { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 12px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 6px; margin-block: 8px 10px; box-shadow: var(--shadow); }
.tab { border: 0; background: none; color: var(--muted); font: 800 11px var(--f-body); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; cursor: pointer; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--surface-2); }
.textbtn { border: 0; background: none; color: var(--muted); font: 800 13px var(--f-body); padding: 8px 4px; cursor: pointer; }

/* ---- Cards ---- */
.deck { perspective: 1200px; height: clamp(300px, 52svh, 440px); touch-action: pan-y; cursor: pointer; margin-top: 4px; user-select: none; }
.deck.in-r { animation: inR .32s ease-out; } .deck.in-l { animation: inL .32s ease-out; }
.card3d { position: relative; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,.7,.2,1); }
.card3d.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 26px; padding: 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; overflow: hidden; color: #1D1B2F; box-shadow: 0 14px 30px rgba(29,27,47,.18); }
.back { transform: rotateY(180deg); }
.f-top { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
.f-ico { width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.75); display: grid; place-items: center; font-size: 21px; }
.f-tag, .b-label { font: 700 11px var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: #4B4766; }
.f-q { margin: auto 0; font: 700 clamp(21px, 6vw, 27px)/1.25 var(--f-display); position: relative; z-index: 1; text-wrap: balance; }
.f-num { position: absolute; right: 14px; bottom: -26px; font: 800 130px/1 var(--f-display); color: rgba(255,255,255,.6); }
.f-foot { font-size: 12px; font-weight: 800; color: #5B5775; position: relative; z-index: 1; }
.stamp { margin-left: auto; border: 2.5px solid #1F9D61; color: #1F9D61; font: 800 11px var(--f-display); letter-spacing: .1em; padding: 4px 9px; border-radius: 9px; transform: rotate(6deg); background: rgba(255,255,255,.75); }
.b-t { font: italic 600 20px/1.35 var(--f-body); margin: 6px 0 18px; }
.b-s { font: 700 18px/1.35 var(--f-display); margin: 6px 0 auto; background: rgba(255,255,255,.65); border-radius: 16px; padding: 14px 16px; }
.dots { display: flex; justify-content: center; gap: 6px; margin: 16px 0 12px; }
.dots i { width: 8px; height: 8px; border-radius: 9px; background: var(--line); transition: width .3s; }
.dots i.done { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.dots i.on { width: 22px; background: var(--accent); }
.ctrl { display: flex; gap: 10px; align-items: center; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; flex: none; }
.round svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.primary { flex: 1; min-width: 0; height: 52px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font: 800 15px var(--f-body); cursor: pointer; }
.primary.is-done { background: var(--surface-2); color: var(--accent); }
.links { display: flex; justify-content: center; gap: 18px; margin-top: 8px; }
.hint { text-align: center; color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }

/* ---- Chat ---- */
.v-chat { overflow: hidden; display: flex; flex-direction: column; padding-bottom: 0; }
.chat { flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(var(--chat-dot) 1.2px, transparent 1.4px) 0 0 / 14px 14px, var(--chat-bg); }
.chat-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: linear-gradient(90deg, #4F46E5, #0EA5E9); color: #FFFFFF; }
.chat-bar b { font-size: 15px; font-weight: 900; } .chat-bar small { display: block; font-size: 12px; opacity: .9; }
.av { width: 38px; height: 38px; border-radius: 50%; background: #FFFFFF; color: #4F46E5; font-weight: 900; font-size: 13px; display: grid; place-items: center; position: relative; flex: none; }
.av::after { content: ""; position: absolute; right: -1px; bottom: 0; width: 10px; height: 10px; border-radius: 50%; background: #22C55E; border: 2px solid #FFFFFF; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 84%; padding: 8px 12px 6px; border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.08); animation: pop .25s ease-out; overflow-wrap: anywhere; line-height: 1.35; }
.msg.in { align-self: flex-start; background: var(--bubble-in); color: var(--fg); border-top-left-radius: 5px; }
.msg.out { align-self: flex-end; background: var(--bubble-out); color: var(--bubble-out-fg); border-top-right-radius: 5px; white-space: pre-wrap; }
.msg .q { font-weight: 800; }
.msg .q i { font-style: normal; background: var(--c-chat); color: var(--on-accent); border-radius: 7px; padding: 1px 6px; font-size: 11px; margin-right: 6px; vertical-align: 1px; }
.msg .t { font-size: 13px; font-style: italic; color: var(--muted); margin-top: 2px; }
.tm { display: block; text-align: right; font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: normal; }
.out .tm { color: inherit; opacity: .75; } .tm b { color: var(--c-chat); }
.msg.day { align-self: center; background: var(--surface); color: var(--c-chat); font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; }
.msg.typing { padding: 12px 14px; }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
.end-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.end-actions button { border: 0; border-radius: 999px; padding: 8px 14px; font: 800 13px var(--f-body); background: var(--c-chat); color: var(--on-accent); cursor: pointer; }
.end-actions button + button { background: var(--surface-2); color: var(--fg); }
.end-actions textarea { width: 100%; min-height: 90px; font: 13px var(--f-body); border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.composer-wrap { background: var(--surface); border-top: 1px solid var(--line); padding: 8px 10px 10px; }
.quick { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 6px; font-size: 12px; color: var(--muted); font-weight: 700; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1.5px solid var(--line); border-radius: 20px; padding: 10px 14px; font: 600 16px/1.3 var(--f-body); background: var(--bg); color: var(--fg); max-height: 120px; }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: linear-gradient(135deg, #4F46E5, #0EA5E9); color: #FFFFFF; display: grid; place-items: center; flex: none; cursor: pointer; }
.send svg { width: 20px; height: 20px; fill: currentColor; }
.send:disabled, .composer textarea:disabled { opacity: .45; }

/* ---- Wheel ---- */
.v-ruleta { background: radial-gradient(circle at 50% 30%, color-mix(in srgb, #FFCA3A 24%, var(--wheel-bg)) 0, var(--wheel-bg) 65%); border-radius: 24px; padding: 16px 14px 18px; color: var(--wheel-ink); }
.w-head { text-align: center; }
.w-head h2 { font: 400 clamp(26px, 8vw, 34px)/1 var(--f-game); margin: 0; text-shadow: 3px 3px 0 #FFCA3A; }
.w-head p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.wheel-box { position: relative; width: min(100%, 340px); aspect-ratio: 1; margin: 18px auto 12px; }
#wheel { width: 100%; height: 100%; display: block; transition: transform 4.2s cubic-bezier(.12,.7,.1,1); }
#wheel .lt { animation: glow 1.1s infinite alternate; } #wheel .lt.b { animation-delay: .55s; }
.pointer { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 34px solid #E4572E; filter: drop-shadow(0 2px 0 #FFFFFF); z-index: 2; }
.hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 23%; aspect-ratio: 1; border-radius: 50%; border: 4px solid #FFFFFF; background: #1B1F3B; color: #FFCA3A; font: 400 clamp(11px, 3.4vw, 14px) var(--f-game); cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.spin-btn { display: block; width: 100%; height: 54px; border: 2px solid #FFCA3A; border-radius: 999px; background: #1B1F3B; color: #FFCA3A; font: 400 17px var(--f-game); letter-spacing: .04em; box-shadow: 0 4px 0 #FFCA3A; cursor: pointer; }
.spin-btn:disabled { opacity: .6; }
.w-left { text-align: center; font-weight: 800; color: var(--muted); font-size: 13px; margin: 14px 0 6px; }
.w-list { background: var(--surface); color: var(--fg); border-radius: 18px; padding: 4px 14px; margin-top: 10px; border: 1px solid var(--line); }
.w-list summary { font-weight: 900; padding: 10px 0; cursor: pointer; }
.w-list ol { list-style: none; margin: 0; padding: 0 0 8px; display: grid; gap: 10px; }
.w-list li { display: flex; gap: 10px; align-items: flex-start; }
.w-list li .n { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px solid #1B1F3B; color: #FFFFFF; font: 400 11px var(--f-game); display: grid; place-items: center; }
.w-list li.done .q { text-decoration: line-through; color: var(--muted); }
.w-list .q { font-weight: 800; } .w-list .t { font-size: 13px; font-style: italic; color: var(--muted); }

/* ---- Corkboard ---- */
.v-corcho { padding-bottom: 0; }
.board { min-height: 100%; border-radius: 22px; padding: 18px 14px 20px;
  background: radial-gradient(rgba(96,58,24,.45) 1px, transparent 1.6px) 0 0 / 9px 9px, radial-gradient(rgba(255,236,200,.35) 1px, transparent 1.6px) 4px 5px / 13px 13px, #C8995F;
  box-shadow: inset 0 0 0 6px #7A4A26, inset 0 0 0 8px #4F2C12, inset 0 0 28px rgba(0,0,0,.4); }
.notes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 14px; }
@media (min-width: 500px) { .notes { grid-template-columns: repeat(3, 1fr); } }
.note, .n-title, .n-tips { position: relative; transform: rotate(var(--r, 0deg)); box-shadow: 3px 8px 12px rgba(0,0,0,.3); color: #2B2B2B; font-family: var(--f-hand); }
.note { text-align: left; border: 0; cursor: pointer; padding: 26px 12px 14px; min-height: 140px; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(0,0,0,.05), transparent 16%), var(--c); transition: transform .2s; }
.note:active { transform: rotate(0deg) scale(1.03); }
.note.done { filter: saturate(.55); }
.pin { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FF9A9A, #D62828 55%, #7A0000); box-shadow: 1px 3px 3px rgba(0,0,0,.45); }
.tape { position: absolute; top: -9px; left: 50%; width: 70px; height: 20px; transform: translateX(-50%) rotate(-4deg); background: rgba(255,255,255,.55); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.n-n { position: absolute; right: 9px; top: 5px; font: 700 22px/1 var(--f-script); color: rgba(0,0,0,.35); }
.n-q { font-size: 18px; line-height: 1.2; }
.n-t { font-size: 14px; line-height: 1.2; color: rgba(0,0,0,.58); margin-top: 6px; }
.n-stamp { position: absolute; right: 8px; bottom: 6px; border: 2px solid #C0392B; color: #C0392B; font: 700 18px/1 var(--f-script); padding: 2px 7px 0; border-radius: 6px; transform: rotate(-10deg); }
.n-title { grid-column: 1 / -1; --r: -1deg; padding: 14px 16px 14px 34px; background: linear-gradient(90deg, transparent 22px, #F28B8B 22px 24px, transparent 24px), repeating-linear-gradient(transparent 0 23px, #B7D0F0 23px 24px), #FFFDF7; }
.n-title h2 { font: 700 34px/1 var(--f-script); color: #1F3B8A; margin: 0 0 4px; }
.n-title p { margin: 0; font-size: 16px; line-height: 24px; }
.n-tips { grid-column: 1 / -1; --r: .8deg; padding: 22px 16px 14px; background: #FFFFFF; }
.n-tips b { font: 700 24px/1 var(--f-script); display: block; margin-bottom: 6px; }
.n-tips p { margin: 0; font-size: 17px; line-height: 1.4; }
.rand { display: block; width: 100%; height: 54px; margin-top: 22px; border: 0; border-radius: 6px; background: #FFF475; color: #2B2B2B; font: 700 26px var(--f-script); box-shadow: 3px 6px 0 rgba(0,0,0,.28); transform: rotate(-.6deg); cursor: pointer; }
.board .textbtn { color: #FFF6E5; display: block; margin: 12px auto 0; }

/* ---- Bottom sheet ---- */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); animation: fade .2s; }
.sheet { width: 100%; max-width: 520px; border-radius: 26px; padding: 24px 22px 22px; animation: up .3s cubic-bezier(.2,.8,.2,1); }
.sheet.s-wheel { background: var(--surface); color: var(--fg); border-top: 8px solid var(--c); margin-top: 40px; }
.sw-num { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #1B1F3B; display: grid; place-items: center; font: 400 22px var(--f-game); color: #FFFFFF; margin: -58px auto 12px; background: var(--c); box-shadow: 0 4px 0 #1B1F3B; }
.sw-q { font: 800 22px/1.3 var(--f-body); text-align: center; margin: 0; text-wrap: balance; }
.sw-t { text-align: center; color: var(--muted); font-style: italic; margin: 8px 0 0; }
.sheet.s-note { background: linear-gradient(180deg, rgba(0,0,0,.05), transparent 14%), var(--c); color: #2B2B2B; font-family: var(--f-hand); transform: rotate(-1.2deg); border-radius: 4px; box-shadow: 4px 12px 24px rgba(0,0,0,.35); position: relative; }
.sn-n { font: 700 32px/1 var(--f-script); color: rgba(0,0,0,.4); }
.sn-q { font-size: 28px; line-height: 1.2; margin: 8px 0 0; }
.sn-t { font-size: 19px; color: rgba(0,0,0,.6); margin: 10px 0 0; }
.sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
.sheet-actions button { flex: 1; min-width: 0; height: 50px; border-radius: 999px; font: 800 15px var(--f-body); cursor: pointer; }
#sheetDone { border: 0; background: var(--accent); color: var(--on-accent); }
#sheetClose { border: 1.5px solid var(--line); background: transparent; color: inherit; }
.s-note #sheetDone { background: #2B2B2B; color: #FFFFFF; }
.s-note #sheetClose { border-color: rgba(0,0,0,.35); }

/* ---- PC: pestañas a la izquierda, cada juego aprovecha el ancho ---- */
@media (min-width: 900px) {
  .app { max-width: 1180px; display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); column-gap: 28px; padding-inline: 32px; padding-bottom: 20px; }
  .top { grid-column: 1 / -1; padding-block: 20px 10px; gap: 12px; }
  .ttl h1 { font-size: 28px; }
  .home { width: auto; padding: 0 14px; border-radius: 999px; }
  .home span { display: inline; }
  .prog { grid-column: 2; grid-row: 2; }
  .tabs { grid-column: 1; grid-row: 2 / 4; align-self: start; grid-template-columns: 1fr; gap: 6px; margin: 0; padding: 8px; }
  .tab { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 12px 14px; font-size: 14px; }
  .stage { grid-column: 2; grid-row: 3; }
  .v-cards > * { width: 100%; max-width: 640px; margin-inline: auto; }
  .deck { height: clamp(340px, 56vh, 480px); }
  .v-chat .chat { width: 100%; max-width: 860px; margin-inline: auto; }
  .v-ruleta { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 32px; align-content: start; align-items: start; padding: 24px 28px; }
  .v-ruleta .wheel-box { width: min(100%, 380px); }
  .v-ruleta .w-list { margin-top: 0; }
  .notes { grid-template-columns: repeat(4, 1fr); }
  .rand { max-width: 360px; margin-inline: auto; }
}

@keyframes inR { from { transform: translateX(36px); opacity: 0; } }
@keyframes inL { from { transform: translateX(-36px); opacity: 0; } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes glow { from { fill: #FFE9A8; } to { fill: #FFB703; } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <a class="home" href="/juegos" aria-label="Volver a los juegos de MyDinoEnglish"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>Juegos</span></a>
    <div class="ttl"><small id="eyebrow">Tarjetas · Vida diaria</small><h1 id="modeTitle">Conversation Cards</h1></div>
    <button class="chip timer" id="timer" type="button" aria-label="Temporizador de 30 segundos"><span class="ring"></span><span id="timerTxt">30s</span></button>
    <button class="chip es-btn" id="esToggle" type="button" aria-pressed="true" aria-label="Mostrar traducción al español">ES</button>
  </header>
  <div class="prog"><div class="bar"><i id="progFill"></i></div><span id="progTxt">0/10 respondidas</span></div>

  <main class="stage">
    <!-- Cards -->
    <section class="view" id="v-cards" data-mode="cards">
      <div class="deck" id="deck" tabindex="0" role="button" aria-label="Tarjeta: toca para voltear">
        <div class="card3d" id="card3d"><div class="face front" id="front"></div><div class="face back" id="back"></div></div>
      </div>
      <div class="dots" id="dots"></div>
      <div class="ctrl">
        <button class="round" id="cPrev" type="button" aria-label="Tarjeta anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="primary" id="cDone" type="button">Marcar como respondida</button>
        <button class="round" id="cNext" type="button" aria-label="Tarjeta siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="links"><button class="textbtn" id="cShuffle" type="button">Barajar</button><button class="textbtn" id="cReset" type="button">Reiniciar</button></div>
      <p class="hint">Toca la tarjeta para voltearla · desliza para cambiar</p>
    </section>

    <!-- Chat -->
    <section class="view v-chat" id="v-chat" data-mode="chat" hidden>
      <div class="chat">
        <div class="chat-bar"><div class="av">EB</div><div><b>English Buddy</b><small id="chatStatus">online</small></div></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="composer-wrap">
          <div class="quick"><span id="chatCount">Pregunta 1 de 10</span><button class="textbtn" id="chatSkip" type="button">Saltar pregunta</button></div>
          <form class="composer" id="composer">
            <textarea id="chatInput" rows="1" placeholder="Escribe tu respuesta en inglés…" aria-label="Tu respuesta"></textarea>
            <button class="send" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M3 20.5l18-8.5L3 3.5v6.6l12 1.9-12 1.9z"/></svg></button>
          </form>
        </div>
      </div>
    </section>

    <!-- Wheel -->
    <section class="view v-ruleta" id="v-ruleta" data-mode="ruleta" hidden>
      <div class="w-main">
        <div class="w-head"><h2>Spin the Wheel!</h2><p>Gira, responde en voz alta y marca la pregunta.</p></div>
        <div class="wheel-box">
          <div class="pointer"></div>
          <svg id="wheel" viewBox="-120 -120 240 240" role="img" aria-label="Ruleta con 10 preguntas"></svg>
          <button class="hub" id="hub" type="button" aria-label="Girar la ruleta">SPIN</button>
        </div>
        <button class="spin-btn" id="spin" type="button">Girar la ruleta</button>
        <p class="w-left" id="wLeft"></p>
        <button class="textbtn" id="wReset" type="button" style="display:block;margin:0 auto">Reiniciar ruleta</button>
      </div>
      <details class="w-list"><summary>Ver las 10 preguntas</summary><ol id="wList"></ol></details>
    </section>

    <!-- Corkboard -->
    <section class="view v-corcho" id="v-corcho" data-mode="corcho" hidden>
      <div class="board">
        <div class="notes" id="notes"></div>
        <button class="rand" id="randNote" type="button">Nota al azar</button>
        <button class="textbtn" id="bReset" type="button">Reiniciar tablero</button>
      </div>
    </section>
  </main>

  <nav class="tabs" role="tablist" aria-label="Juegos">
    <button class="tab" role="tab" data-tab="cards" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg>Tarjetas</button>
    <button class="tab" role="tab" data-tab="chat" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 4z"/></svg>Chat</button>
    <button class="tab" role="tab" data-tab="ruleta" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>Ruleta</button>
    <button class="tab" role="tab" data-tab="corcho" type="button"><svg viewBox="0 0 24 24"><path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/></svg>Corcho</button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetQ">
    <div id="sheetBody"></div>
    <div class="sheet-actions"><button id="sheetDone" type="button">✓ La respondí</button><button id="sheetClose" type="button">Cerrar</button></div>
  </div>
</div>

<script>
const CARDS = [
  { e: '💡', tag: 'Advice', q: "What's the best piece of advice you have ever received?", t: '¿Cuál es el mejor consejo que has recibido?', s: "The best advice I've ever received was…" },
  { e: '⏳', tag: 'Imagine', q: 'If you could live in any decade, which one would you choose?', t: 'Si pudieras vivir en cualquier década, ¿cuál elegirías?', s: 'I would choose the… because…' },
  { e: '🧘', tag: 'Feelings', q: 'What do you usually do when you feel stressed?', t: '¿Qué sueles hacer cuando te sientes estresado?', s: 'When I feel stressed, I usually…' },
  { e: '🌟', tag: 'People', q: 'Who has influenced you the most in your life?', t: '¿Quién ha influido más en tu vida?', s: 'The person who has influenced me the most is…' },
  { e: '📚', tag: 'Entertainment', q: 'What was the last book or series that you really enjoyed?', t: '¿Cuál fue el último libro o serie que disfrutaste mucho?', s: 'The last series I really enjoyed was…' },
  { e: '🌙', tag: 'Personality', q: 'Are you more of a morning person or a night person? Why?', t: '¿Eres más de mañana o de noche? ¿Por qué?', s: "I'm definitely a … person because…" },
  { e: '🏆', tag: 'Achievements', q: 'What is something you are really proud of?', t: '¿De qué te sientes realmente orgulloso?', s: "I'm really proud of…" },
  { e: '💸', tag: 'Money', q: 'How do you usually spend your money?', t: '¿En qué sueles gastar tu dinero?', s: 'I usually spend my money on…' },
  { e: '💼', tag: 'Work', q: 'What would your perfect job look like?', t: '¿Cómo sería tu trabajo perfecto?', s: 'My perfect job would be…' },
  { e: '🎯', tag: 'Goals', q: 'What is a skill you would like to learn this year?', t: '¿Qué habilidad te gustaría aprender este año?', s: "This year I'd like to learn…" },
];
const CHAT = [
  ['What did you do last weekend?', '¿Qué hiciste el fin de semana pasado?'],
  ['Have you got any plans for the holidays?', '¿Tienes planes para las vacaciones?'],
  ["What's the best trip you've ever taken?", '¿Cuál es el mejor viaje que has hecho?'],
  ['Do you prefer traveling alone or with friends?', '¿Prefieres viajar solo o con amigos?'],
  ["What's something you always pack in your suitcase?", '¿Qué es algo que siempre empacas en tu maleta?'],
  ['Which country would you like to live in for a year?', '¿En qué país te gustaría vivir por un año?'],
  ['Have you ever gotten lost in a new city?', '¿Alguna vez te has perdido en una ciudad nueva?'],
  ["What's the strangest food you've ever tried?", '¿Cuál es la comida más extraña que has probado?'],
  ['Are you going to travel anywhere this year?', '¿Vas a viajar a algún lugar este año?'],
  ['How do you usually plan a trip?', '¿Cómo sueles planear un viaje?'],
];
const WHEEL = [
  ['How many hours a day do you spend on your phone?', '¿Cuántas horas al día pasas en tu teléfono?'],
  ['Which app could you not live without?', '¿Sin qué aplicación no podrías vivir?'],
  ['Do you think robots will replace teachers one day?', '¿Crees que los robots reemplazarán a los maestros algún día?'],
  ['What was the first phone you ever had?', '¿Cuál fue el primer teléfono que tuviste?'],
  ['How has the internet changed your free time?', '¿Cómo ha cambiado internet tu tiempo libre?'],
  ['Would you travel to Mars if you had the chance?', '¿Viajarías a Marte si tuvieras la oportunidad?'],
  ['What invention do you think is the most important?', '¿Qué invento crees que es el más importante?'],
  ['Do you prefer reading on paper or on a screen?', '¿Prefieres leer en papel o en pantalla?'],
  ['What will cities look like in 50 years?', '¿Cómo serán las ciudades dentro de 50 años?'],
  ['Should children use social media? Why or why not?', '¿Deberían los niños usar redes sociales? ¿Por qué?'],
];
const BOARD = [
  ['What did you have for breakfast this morning?', '¿Qué desayunaste esta mañana?'],
  ["What's your favorite comfort food?", '¿Cuál es tu comida reconfortante favorita?'],
  ['How often do you exercise?', '¿Con qué frecuencia haces ejercicio?'],
  ['Have you ever cooked a meal for a big group?', '¿Alguna vez has cocinado para un grupo grande?'],
  ['What healthy habit are you trying to build?', '¿Qué hábito saludable estás tratando de formar?'],
  ['Is it better to eat at home or at a restaurant?', '¿Es mejor comer en casa o en un restaurante?'],
  ['What food did you hate as a child but love now?', '¿Qué comida odiabas de niño y ahora te encanta?'],
  ['How many hours of sleep do you need to feel good?', '¿Cuántas horas de sueño necesitas para sentirte bien?'],
  ['What would you cook to impress someone?', '¿Qué cocinarías para impresionar a alguien?'],
  ["What's the healthiest thing you did this week?", '¿Qué es lo más saludable que hiciste esta semana?'],
];
const MODES = {
  cards:  { title: 'Conversation Cards', eyebrow: 'Tarjetas · Vida diaria' },
  chat:   { title: 'Travel Chat', eyebrow: 'Chat · Viajes y planes' },
  ruleta: { title: 'Spin the Wheel', eyebrow: 'Ruleta · Tecnología y futuro' },
  corcho: { title: 'Speaking Board', eyebrow: 'Corcho · Comida, salud y hábitos' },
};
const GRADS = ['#FFD6E0,#FFEFD6', '#D6F0FF,#E6DEFF', '#DFFAD6,#FFF6CC', '#FFE1D6,#FFD6EE', '#D9E2FF,#D3FAF1',
               '#FFF1C9,#FFD9D9', '#E5DBFF,#FFD9F2', '#D3F8E2,#D6ECFF', '#FFE4CC,#FFF6D6', '#E0D9FF,#D6F5FF'];
const SEG = ['#FF595E', '#FF924C', '#FFCA3A', '#8AC926', '#2BB673', '#1982C4', '#4267AC', '#6A4C93', '#B5179E', '#F15BB5'];
const NOTE = ['#FFF475', '#FFB3C7', '#B6F2A6', '#A8DBFF', '#FFCC80', '#E1C8FF'];
const ROT = [-2, 1.5, -1, 2, -2.5, 1, -1.5, 2.5, -1, 1.5];
const REACT = ['Nice! 😊', 'Oh, interesting!', 'Cool, thanks for sharing!', 'I see! 👀', 'Great answer! 👏', 'Sounds fun!', 'Wow, really?'];

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

// per-viewer progress only (localStorage may be unavailable; the app works without it)
const KEY = 'b1-speaking-games-v1';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
S = { tab: 'cards', es: true, chat: [], ...S };
S.done = { cards: [], ruleta: [], corcho: [], ...(S.done || {}) };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const toggleDone = (m, i) => { const d = S.done[m]; d.includes(i) ? d.splice(d.indexOf(i), 1) : d.push(i); save(); progress(); };

// confirm-by-second-tap (confirm() dialogs don't show in the viewer)
function twice(btn, fn) {
  const label = btn.textContent;
  btn.addEventListener('click', () => {
    if (btn.dataset.arm) { delete btn.dataset.arm; btn.textContent = label; fn(); return; }
    btn.dataset.arm = 1; btn.textContent = '¿Seguro? Toca otra vez';
    setTimeout(() => { if (btn.dataset.arm) { delete btn.dataset.arm; btn.textContent = label; } }, 3000);
  });
}

/* ---------- shell ---------- */
function progress() {
  const n = S.tab === 'chat' ? S.chat.filter(Boolean).length : S.done[S.tab].length;
  $('progFill').style.width = n * 10 + '%';
  $('progTxt').textContent = `${n}/10 respondidas`;
}
function show(tab) {
  if (!MODES[tab]) tab = 'cards';
  S.tab = tab; save();
  document.querySelectorAll('.view').forEach(v => v.hidden = v.dataset.mode !== tab);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('modeTitle').textContent = MODES[tab].title;
  $('eyebrow').textContent = MODES[tab].eyebrow;
  document.documentElement.style.setProperty('--accent', `var(--c-${tab})`);
  progress();
  if (tab === 'chat') scrollChat();
  try { history.replaceState(null, '', '#' + tab); } catch {}
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));

function applyEs() {
  document.body.classList.toggle('no-es', !S.es);
  $('esToggle').setAttribute('aria-pressed', S.es);
}
$('esToggle').addEventListener('click', () => { S.es = !S.es; save(); applyEs(); });

let tEnd = 0, tInt = null;
const timerReset = () => { clearInterval(tInt); tInt = null; $('timerTxt').textContent = '30s'; $('timer').style.setProperty('--p', '0deg'); };
function tick() {
  const left = Math.max(0, tEnd - Date.now());
  $('timerTxt').textContent = Math.ceil(left / 1000) + 's';
  $('timer').style.setProperty('--p', (1 - left / 30000) * 360 + 'deg');
  if (!left) {
    timerReset(); $('timer').classList.add('over'); $('timerTxt').textContent = '¡Tiempo!';
    setTimeout(() => { $('timer').classList.remove('over'); if (!tInt) $('timerTxt').textContent = '30s'; }, 2500);
  }
}
$('timer').addEventListener('click', () => {
  if (tInt) return timerReset();
  $('timer').classList.remove('over'); tEnd = Date.now() + 30000; tick(); tInt = setInterval(tick, 200);
});

/* ---------- cards ---------- */
let ci = 0, order = [...Array(10).keys()];
function renderCard(dir) {
  const i = order[ci], c = CARDS[i], done = S.done.cards.includes(i), g = `linear-gradient(135deg,${GRADS[i]})`;
  $('card3d').classList.remove('flipped');
  $('front').style.background = g; $('back').style.background = g;
  $('front').innerHTML = `<div class="f-top"><span class="f-ico">${c.e}</span><span class="f-tag">${c.tag}</span>${done ? '<span class="stamp">✓ Done</span>' : ''}</div>
    <p class="f-q">${c.q}</p><div class="f-foot">↻ Toca para voltear</div><span class="f-num">${String(i + 1).padStart(2, '0')}</span>`;
  $('back').innerHTML = `<div class="b-label es">En español</div><p class="b-t es">${c.t}</p>
    <div class="b-label">Empieza así</div><p class="b-s">“${c.s}”</p><div class="f-foot">↻ Toca para volver</div>`;
  $('dots').innerHTML = order.map((k, n) => `<i class="${n === ci ? 'on' : ''} ${S.done.cards.includes(k) ? 'done' : ''}"></i>`).join('');
  $('cDone').textContent = done ? '✓ Respondida' : 'Marcar como respondida';
  $('cDone').classList.toggle('is-done', done);
  if (dir) { const d = $('deck'); d.classList.remove('in-r', 'in-l'); void d.offsetWidth; d.classList.add(dir > 0 ? 'in-r' : 'in-l'); }
}
const step = d => { ci = (ci + d + 10) % 10; renderCard(d); };
const flip = () => $('card3d').classList.toggle('flipped');
let x0 = null;
$('deck').addEventListener('pointerdown', e => { x0 = e.clientX; });
$('deck').addEventListener('pointerup', e => {
  if (x0 === null) return;
  const dx = e.clientX - x0; x0 = null;
  Math.abs(dx) > 50 ? step(dx < 0 ? 1 : -1) : flip();
});
$('deck').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});
$('cPrev').addEventListener('click', () => step(-1));
$('cNext').addEventListener('click', () => step(1));
$('cDone').addEventListener('click', () => { toggleDone('cards', order[ci]); renderCard(); });
$('cShuffle').addEventListener('click', () => {
  for (let k = order.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; }
  ci = 0; renderCard(1);
});
twice($('cReset'), () => { S.done.cards = []; save(); progress(); order = [...Array(10).keys()]; ci = 0; renderCard(-1); });

/* ---------- chat ---------- */
const msgs = $('msgs');
const scrollChat = () => requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
function bubble(cls, html) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; msgs.appendChild(d); scrollChat(); return d; }
const botQ = i => bubble('in', `<div class="q"><i>Q${i + 1}</i>${CHAT[i][0]}</div><div class="t es">${CHAT[i][1]}</div><span class="tm">${now()}</span>`);
const userA = a => bubble('out', `${a ? esc(a) : '<em>(pregunta saltada)</em>'}<span class="tm">${now()} <b>✓✓</b></span>`);
function chatState() {
  const done = S.chat.length >= 10;
  $('chatInput').disabled = done; $('composer').querySelector('button').disabled = done; $('chatSkip').hidden = done;
  $('chatCount').textContent = done ? 'Chat terminado' : `Pregunta ${S.chat.length + 1} de 10`;
}
function finale() {
  const n = S.chat.filter(Boolean).length;
  const d = bubble('in', `<div class="q">That's all! 🎉 You answered ${n} of 10 questions. Now read your answers out loud.</div>
    <div class="t es">¡Eso es todo! Respondiste ${n} de 10. Ahora lee tus respuestas en voz alta.</div>
    <div class="end-actions"><button type="button" data-a="copy">Copiar mis respuestas</button><button type="button" data-a="again">Empezar de nuevo</button></div>`);
  const again = d.querySelector('[data-a="again"]');
  twice(again, () => { S.chat = []; save(); progress(); buildChat(); });
  d.querySelector('[data-a="copy"]').addEventListener('click', e => {
    const txt = 'Travel Chat · B1\n\n' + CHAT.map((q, i) => `Q${i + 1}. ${q[0]}\nA: ${S.chat[i] || '(skipped)'}`).join('\n\n');
    const btn = e.currentTarget;
    const fallback = () => {
      if (d.querySelector('textarea')) return;
      const ta = document.createElement('textarea'); ta.readOnly = true; ta.value = txt;
      d.querySelector('.end-actions').appendChild(ta); ta.focus(); ta.select();
      btn.textContent = 'Copia el texto de abajo';
    };
    try { navigator.clipboard.writeText(txt).then(() => { btn.textContent = '¡Copiado!'; }, fallback); } catch { fallback(); }
  });
}
function buildChat() {
  msgs.innerHTML = '';
  bubble('day', 'Today');
  bubble('in', `<div class="q">Hi! 👋 I'm your English Buddy. Let's talk about travel. Answer in English, 2–3 sentences.</div><div class="t es">¡Hola! Hablemos de viajes. Responde en inglés con 2 o 3 oraciones.</div><span class="tm">${now()}</span>`);
  S.chat.forEach((a, i) => { botQ(i); userA(a); });
  S.chat.length < 10 ? botQ(S.chat.length) : finale();
  chatState();
}
let busy = false;
function send(text) {
  if (busy || S.chat.length >= 10) return;
  busy = true;
  S.chat.push(text); save(); progress();
  userA(text); chatState();
  const input = $('chatInput'); input.value = ''; input.style.height = '';
  $('chatStatus').textContent = 'typing…';
  const typing = bubble('in typing', '<span></span><span></span><span></span>');
  setTimeout(() => {
    typing.remove(); $('chatStatus').textContent = 'online';
    if (text) bubble('in', `<div class="q">${REACT[Math.floor(Math.random() * REACT.length)]}</div>`);
    S.chat.length < 10 ? botQ(S.chat.length) : finale();
    busy = false;
  }, reduce ? 250 : 1100);
}
$('composer').addEventListener('submit', e => { e.preventDefault(); const v = $('chatInput').value.trim(); if (v) send(v); });
$('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); } });
$('chatInput').addEventListener('input', e => { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; });
$('chatSkip').addEventListener('click', () => send(''));

/* ---------- wheel ---------- */
const pt = (deg, r) => [r * Math.cos(deg * Math.PI / 180), r * Math.sin(deg * Math.PI / 180)].map(v => v.toFixed(2));
function drawWheel() {
  let s = '<circle r="114" fill="#1B1F3B" stroke="#FFCA3A" stroke-width="2"/>';
  for (let k = 0; k < 24; k++) { const [x, y] = pt(k * 15, 107); s += `<circle class="lt ${k % 2 ? 'b' : ''}" cx="${x}" cy="${y}" r="3.2" fill="#FFE9A8"/>`; }
  SEG.forEach((c, i) => {
    const done = S.done.ruleta.includes(i);
    const a0 = -108 + i * 36, [x0, y0] = pt(a0, 100), [x1, y1] = pt(a0 + 36, 100), [nx, ny] = pt(a0 + 18, 70);
    s += `<path d="M0,0 L${x0},${y0} A100,100 0 0,1 ${x1},${y1} Z" fill="${done ? '#CFC8BA' : c}" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="${nx}" cy="${ny}" r="14" fill="#FFFFFF"/>
      <text x="${nx}" y="${ny}" dy="5" text-anchor="middle" font-family="Bungee, Impact, sans-serif" font-size="${done ? 15 : 14}" fill="${done ? '#8A8478' : '#1B1F3B'}">${done ? '✓' : i + 1}</text>`;
  });
  $('wheel').innerHTML = s;
  const left = 10 - S.done.ruleta.length;
  $('wLeft').textContent = left ? `${left} preguntas sin responder` : '¡Completaste la ruleta! 🎉';
  $('spin').disabled = !left;
  $('wList').innerHTML = WHEEL.map(([q, t], i) => `<li class="${S.done.ruleta.includes(i) ? 'done' : ''}"><span class="n" style="background:${SEG[i]}">${i + 1}</span><div><div class="q">${q}</div><div class="t es">${t}</div></div></li>`).join('');
}
let rot = 0, spinning = false;
function spin() {
  const left = [...Array(10).keys()].filter(i => !S.done.ruleta.includes(i));
  if (spinning || !left.length) return;
  const i = left[Math.floor(Math.random() * left.length)];
  // segment i is centered at -90+36i degrees; rotate so it lands under the pointer, with a little wobble
  const target = -i * 36 + (Math.random() - .5) * 22;
  rot += 1800 + ((target - rot) % 360 + 360) % 360;
  spinning = true; $('spin').disabled = true;
  $('wheel').style.transform = `rotate(${rot}deg)`;
  setTimeout(() => { spinning = false; $('spin').disabled = false; openSheet('ruleta', i); }, reduce ? 300 : 4300);
}
$('spin').addEventListener('click', spin);
$('hub').addEventListener('click', spin);
twice($('wReset'), () => { S.done.ruleta = []; save(); progress(); drawWheel(); });

/* ---------- corkboard ---------- */
function drawBoard() {
  $('notes').innerHTML = `<div class="n-title"><h2>Food, Health &amp; Habits</h2><p>Toca una nota para abrirla.<br>Answer out loud!</p></div>` +
    BOARD.map(([q, t], i) => {
      const done = S.done.corcho.includes(i);
      return `<button class="note ${done ? 'done' : ''}" type="button" data-i="${i}" style="--r:${ROT[i]}deg;--c:${NOTE[i % NOTE.length]}">
        <span class="${i % 3 === 1 ? 'tape' : 'pin'}"></span><span class="n-n">#${i + 1}</span>
        <span class="n-q">${q}</span><span class="n-t es">${t}</span>${done ? '<span class="n-stamp">done ✓</span>' : ''}</button>`;
    }).join('') +
    `<div class="n-tips"><span class="pin"></span><b>Useful answers</b><p>I usually… · I've never… · I'd rather… · To be honest… · It depends on…</p></div>`;
}
$('notes').addEventListener('click', e => { const n = e.target.closest('.note'); if (n) openSheet('corcho', +n.dataset.i); });
$('randNote').addEventListener('click', () => {
  const left = [...Array(10).keys()].filter(i => !S.done.corcho.includes(i));
  const pool = left.length ? left : [...Array(10).keys()];
  openSheet('corcho', pool[Math.floor(Math.random() * pool.length)]);
});
twice($('bReset'), () => { S.done.corcho = []; save(); progress(); drawBoard(); });

/* ---------- sheet ---------- */
let cur = null, lastFocus = null;
function openSheet(mode, i) {
  cur = { mode, i }; lastFocus = document.activeElement;
  const sh = $('sheet');
  if (mode === 'ruleta') {
    sh.className = 'sheet s-wheel'; sh.style.setProperty('--c', SEG[i]);
    $('sheetBody').innerHTML = `<div class="sw-num">${i + 1}</div><p class="sw-q" id="sheetQ">${WHEEL[i][0]}</p><p class="sw-t es">${WHEEL[i][1]}</p>`;
  } else {
    sh.className = 'sheet s-note'; sh.style.setProperty('--c', NOTE[i % NOTE.length]);
    $('sheetBody').innerHTML = `<span class="sn-n">#${i + 1}</span><p class="sn-q" id="sheetQ">${BOARD[i][0]}</p><p class="sn-t es">${BOARD[i][1]}</p>`;
  }
  $('sheetDone').textContent = S.done[mode].includes(i) ? 'Quitar marca' : '✓ La respondí';
  $('scrim').hidden = false; $('sheetDone').focus();
}
function closeSheet() { $('scrim').hidden = true; cur = null; lastFocus?.focus?.(); }
$('sheetClose').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('scrim').hidden) closeSheet(); });
$('sheetDone').addEventListener('click', () => {
  if (!cur) return;
  toggleDone(cur.mode, cur.i);
  cur.mode === 'ruleta' ? drawWheel() : drawBoard();
  closeSheet();
});

/* ---------- boot ---------- */
applyEs(); renderCard(); buildChat(); drawWheel(); drawBoard();
// En PC la lista de la ruleta cabe al lado de la rueda: se abre de entrada.
if (matchMedia('(min-width: 900px)').matches) $('wList').parentElement.open = true;
const fromHash = location.hash.slice(1);
show(MODES[fromHash] ? fromHash : S.tab);
// Un enlace a otra pestaña del mismo juego (#chat, #ruleta…) solo cambia el hash, sin recargar.
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (MODES[h] && h !== S.tab) show(h); });
</script>
</body>
